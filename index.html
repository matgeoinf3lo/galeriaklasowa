<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria Klasowa</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-badge">KLASA</span>
        <div>
          <h1>Galeria Klasowa</h1>
          <p class="subtitle">Wydarzenia, zdjęcia i szybkie wrzucanie z telefonu</p>
        </div>
      </div>
      <button id="openNewFolderBtn" class="btn btn-primary">+ Nowy folder</button>
    </div>
  </header>

  <main class="container">
    <section class="filters-bar" id="filtersBar" aria-label="Filtry wydarzeń"></section>

    <div id="statusMsg" class="status-msg">Ładowanie galerii...</div>
    <div id="galleryContainer" class="gallery-sections"></div>
  </main>

  <!-- Modal dodawania nowego folderu -->
  <div id="newFolderModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="newFolderTitle">
    <div class="modal-backdrop" data-close="newFolderModal"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="newFolderTitle">Nowy folder / wydarzenie</h2>
        <button class="icon-btn" data-close="newFolderModal" aria-label="Zamknij">✕</button>
      </div>

      <form id="newFolderForm" class="form-grid">
        <label class="field">
          <span>Nazwa wydarzenia / folderu</span>
          <input type="text" id="folderName" placeholder="np. Wyjście integracyjne" required />
        </label>

        <label class="field">
          <span>Data wydarzenia</span>
          <input type="date" id="folderDate" required />
        </label>

        <label class="field">
          <span>Zdjęcia (możesz wybrać kilka)</span>
          <input type="file" id="newFolderFiles" accept="image/*" multiple required />
          <small class="hint">Automatyczna kompresja do max 1600 px i lekkiego JPG.</small>
        </label>

        <div id="newFolderProgress" class="upload-progress hidden"></div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close="newFolderModal">Anuluj</button>
          <button type="submit" id="submitNewFolderBtn" class="btn btn-primary">Wyślij i utwórz</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal dodawania zdjęć do istniejącego folderu -->
  <div id="addPhotosModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="addPhotosTitle">
    <div class="modal-backdrop" data-close="addPhotosModal"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="addPhotosTitle">Dodaj zdjęcia do folderu</h2>
        <button class="icon-btn" data-close="addPhotosModal" aria-label="Zamknij">✕</button>
      </div>

      <form id="addPhotosForm" class="form-grid">
        <p id="targetFolderLabel" class="target-folder-pill"></p>

        <label class="field">
          <span>Wybierz zdjęcia z telefonu lub dysku</span>
          <input type="file" id="addPhotosFiles" accept="image/*" multiple required />
          <small class="hint">Zdjęcia zostaną skompresowane i dopisane do tego folderu.</small>
        </label>

        <div id="addPhotosProgress" class="upload-progress hidden"></div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close="addPhotosModal">Anuluj</button>
          <button type="submit" id="submitAddPhotosBtn" class="btn btn-primary">Dodaj zdjęcia</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Lightbox podglądu zdjęcia -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button id="lbClose" class="lb-close" aria-label="Zamknij podgląd">✕</button>
    <button id="lbPrev" class="lb-nav lb-prev" aria-label="Poprzednie zdjęcie">‹</button>
    <div class="lb-content">
      <img id="lbImg" src="" alt="" />
      <div class="lb-bar">
        <div id="lbCaption" class="lb-caption"></div>
        <div class="lb-actions">
          <a id="lbDownload" class="btn btn-primary btn-sm" download>Pobierz</a>
          <button id="lbDelete" type="button" class="btn btn-danger btn-sm">Usuń</button>
        </div>
      </div>
    </div>
    <button id="lbNext" class="lb-nav lb-next" aria-label="Następne zdjęcie">›</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
