<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria Klasowa - MatGeoInf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">III LO // matGEOinf</div>
        <div>
          <h1>Galeria Klasowa</h1>
          <p class="subtitle">Foldery po miesiącach i wydarzeniach • szybkie wrzucanie i pobieranie</p>
        </div>
      </div>

      <button id="openNewFolderBtn" class="btn btn-primary">+ Nowy folder</button>
    </div>
  </header>

  <main class="container">
    <section class="controls-panel" aria-label="Filtrowanie i sortowanie">
      <div class="filter-group">
        <span class="filter-label">Miesiąc / Rok</span>
        <div id="monthFilters" class="chips-row"></div>
      </div>

      <div class="filter-group">
        <span class="filter-label">Folder</span>
        <div id="folderFilters" class="chips-row"></div>
      </div>

      <div class="filter-group">
        <span class="filter-label">Sortowanie</span>
        <div id="sortControls" class="chips-row">
          <button type="button" class="chip active" data-sort="newest">Od najnowszych</button>
          <button type="button" class="chip" data-sort="oldest">Od najstarszych</button>
          <button type="button" class="chip" data-sort="most-photos">Najwięcej zdjęć</button>
        </div>
      </div>
    </section>

    <div id="galleryStatus" class="status-box">Ładowanie galerii...</div>
    <div id="galleryContainer" class="months-stack"></div>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <!-- MODAL: NOWY FOLDER -->
  <div id="newFolderModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="newFolderTitle">
    <div class="modal-backdrop" data-close="newFolderModal"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="newFolderTitle">Nowy folder</h2>
        <button class="icon-btn" data-close="newFolderModal" aria-label="Zamknij">✕</button>
      </div>

      <form id="newFolderForm" class="form-grid">
        <div class="mode-switch" role="tablist" aria-label="Rodzaj folderu">
          <button type="button" class="mode-btn active" data-mode="month">Tylko miesiąc i rok</button>
          <button type="button" class="mode-btn" data-mode="event">Konkretny dzień</button>
        </div>

        <label class="field">
          <span id="folderNameLabel">Nazwa folderu</span>
          <input type="text" id="folderName" placeholder="np. Lekcje / różne" required />
        </label>

        <div id="monthOnlyInputs" class="two-cols">
          <label class="field">
            <span>Miesiąc</span>
            <select id="folderMonthSelect"></select>
          </label>
          <label class="field">
            <span>Rocznik / Rok</span>
            <input type="number" id="folderYearInput" min="2020" max="2035" step="1" required />
          </label>
        </div>

        <label class="field hidden" id="exactDateField">
          <span>Data wydarzenia</span>
          <input type="date" id="folderDate" />
        </label>

        <label class="field">
          <span>Zdjęcia</span>
          <input type="file" id="newFolderFiles" accept="image/*" multiple required />
          <small class="hint">Automatyczna kompresja do max 1600 px i lekkiego JPG.</small>
        </label>

        <div id="newFolderProgress" class="progress-box hidden"></div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close="newFolderModal">Anuluj</button>
          <button type="submit" id="submitNewFolderBtn" class="btn btn-primary">Wyślij i utwórz</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: EDYCJA NAZWY FOLDERU -->
  <div id="renameFolderModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="renameFolderTitle">
    <div class="modal-backdrop" data-close="renameFolderModal"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="renameFolderTitle">Zmień nazwę folderu</h2>
        <button class="icon-btn" data-close="renameFolderModal" aria-label="Zamknij">✕</button>
      </div>

      <form id="renameFolderForm" class="form-grid">
        <div id="renameFolderMeta" class="info-banner"></div>

        <label class="field">
          <span>Nowa nazwa folderu</span>
          <input type="text" id="renameFolderInput" required />
        </label>

        <div id="renameFolderProgress" class="progress-box hidden"></div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close="renameFolderModal">Anuluj</button>
          <button type="submit" id="submitRenameFolderBtn" class="btn btn-primary">Zapisz nazwę</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: DODAJ ZDJĘCIA DO ISTNIEJĄCEGO FOLDERU -->
  <div id="addPhotosModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="addPhotosTitle">
    <div class="modal-backdrop" data-close="addPhotosModal"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="addPhotosTitle">Dodaj zdjęcia</h2>
        <button class="icon-btn" data-close="addPhotosModal" aria-label="Zamknij">✕</button>
      </div>

      <form id="addPhotosForm" class="form-grid">
        <div id="targetFolderBanner" class="info-banner"></div>

        <label class="field">
          <span>Wybierz zdjęcia z telefonu lub dysku</span>
          <input type="file" id="addPhotosFiles" accept="image/*" multiple required />
          <small class="hint">Zdjęcia zostaną automatycznie skompresowane przed wysyłką.</small>
        </label>

        <div id="addPhotosProgress" class="progress-box hidden"></div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close="addPhotosModal">Anuluj</button>
          <button type="submit" id="submitAddPhotosBtn" class="btn btn-primary">Dodaj zdjęcia</button>
        </div>
      </form>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button id="lbClose" class="lb-close" aria-label="Zamknij podgląd">✕</button>
    <button id="lbPrev" class="lb-nav lb-prev" aria-label="Poprzednie zdjęcie">‹</button>
    <div class="lb-content">
      <img id="lbImg" src="" alt="" />
      <div class="lb-bar">
        <div id="lbCaption" class="lb-caption"></div>
        <div class="lb-actions">
          <button id="lbDownload" type="button" class="btn btn-primary btn-sm">Pobierz</button>
          <button id="lbDelete" type="button" class="btn btn-danger btn-sm">Usuń</button>
        </div>
      </div>
    </div>
    <button id="lbNext" class="lb-nav lb-next" aria-label="Następne zdjęcie">›</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
